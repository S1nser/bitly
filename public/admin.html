<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIDLY — админка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{
    --navy:#0a0b20; --navy-raised:#161832; --paper:#f3f1fb; --paper-raised:#fff;
    --violet:#8b5cf6; --violet-strong:#7c3aed; --violet-soft:#b8a2fb;
    --line:#26284f; --line-light:rgba(11,12,31,0.1);
    --text:#f3f1ff; --text-dim:#b3aed6; --ink:#14152b; --ink-dim:#5c5977;
    --good:#3ecf8e; --bad:#f06565;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;}
  h1,h2,h3{font-family:"Sora",system-ui,sans-serif;margin:0;}
  a{color:inherit;}
  .topbar{background:var(--navy);color:var(--text);padding:20px 28px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;}
  .brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(155deg,var(--violet-soft),var(--violet-strong));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:0 0 16px rgba(139,92,246,0.6);}
  .topbar .sub{color:var(--text-dim);font-size:13px;}
  .layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;min-height:calc(100vh - 66px);}
  @media (max-width:960px){.layout{grid-template-columns:1fr;}}
  .list-pane{padding:24px 28px;overflow:auto;}
  .detail-pane{padding:24px 28px;background:var(--paper-raised);border-left:1px solid var(--line-light);overflow:auto;}
  @media (max-width:960px){.detail-pane{border-left:0;border-top:1px solid var(--line-light);}}

  table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--paper-raised);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 rgba(11,12,31,0.03);}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line-light);}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-dim);font-weight:700;}
  tr.app-row{cursor:pointer;transition:background .12s;}
  tr.app-row:hover{background:rgba(139,92,246,0.06);}
  tr.app-row.active{background:rgba(139,92,246,0.12);}
  .pill{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:700;}
  .pill.new{background:rgba(184,162,251,0.18);color:var(--violet-strong);}
  .pill.connected{background:rgba(94,234,212,0.18);color:#0d8f7a;}
  .pill.offer_sent{background:rgba(139,92,246,0.18);color:var(--violet-strong);}
  .pill.interested{background:rgba(62,207,142,0.18);color:#1f7a52;}
  .empty{color:var(--ink-dim);font-size:14px;padding:40px 0;text-align:center;}

  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px;margin-top:14px;}
  .kv dt{color:var(--ink-dim);}
  .kv dd{margin:0;}
  .tagsline span{display:inline-block;background:rgba(139,92,246,0.1);color:var(--violet-strong);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12.5px;}

  .offer-form{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-light);}
  .offer-form label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;margin-top:12px;}
  .offer-form input{width:100%;padding:9px 11px;border:1px solid var(--line-light);border-radius:8px;font-size:13.5px;font-family:inherit;}
  .offer-form button{
    margin-top:16px;width:100%;padding:11px;border:0;border-radius:9px;font-weight:700;font-size:14px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--violet),var(--violet-strong));box-shadow:0 10px 26px -10px rgba(139,92,246,0.65);
  }
  .offer-form button:disabled{opacity:0.6;cursor:progress;}
  .msg{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:8px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(62,207,142,0.12);color:#1f7a52;}
  .msg.err{background:rgba(240,101,101,0.12);color:#a83232;}

  .offers-history{margin-top:22px;}
  .offer-item{padding:10px 0;border-bottom:1px solid var(--line-light);font-size:13px;}
  .offer-item b{font-family:"JetBrains Mono";}
  .placeholder{color:var(--ink-dim);font-size:14px;}

  .attachments{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .attach-thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;cursor:pointer;border:1px solid var(--line-light);background:var(--paper);}
  .attach-file{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:9px;border:1px solid var(--line-light);background:var(--paper);font-size:10px;color:var(--ink-dim);text-align:center;padding:4px;text-decoration:none;}

  .topbar-actions{display:flex;gap:10px;align-items:center;}
  .btn-topbar{
    background:rgba(139,92,246,0.16);color:#fff;border:1px solid rgba(139,92,246,0.4);
    border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .btn-topbar:hover{background:rgba(139,92,246,0.28);}

  .broadcast-panel{
    background:var(--navy-raised);color:var(--text);padding:20px 28px;border-bottom:1px solid var(--line);
    display:none;
  }
  .broadcast-panel.open{display:block;}
  .broadcast-panel h3{font-size:15px;margin-bottom:4px;}
  .broadcast-panel .sub{color:var(--text-dim);font-size:12.5px;margin-bottom:14px;}
  .broadcast-row{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:start;}
  @media (max-width:800px){.broadcast-row{grid-template-columns:1fr;}}
  .broadcast-panel textarea{
    width:100%;min-height:90px;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
    background:#0f1130;color:var(--text);font-family:inherit;font-size:13.5px;resize:vertical;
  }
  .broadcast-panel input[type="file"]{font-size:12.5px;color:var(--text-dim);margin-top:8px;}
  .broadcast-panel .btn-topbar{width:100%;padding:11px;margin-top:10px;}
  .broadcast-panel .btn-topbar:disabled{opacity:0.5;cursor:progress;}
  .broadcast-result{margin-top:10px;font-size:12.5px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">B</span>BIDLY / admin</div>
  <div class="topbar-actions">
    <div class="sub" id="connectedCount"></div>
    <button class="btn-topbar" id="broadcastToggle">📣 Рассылка</button>
  </div>
</div>

<div class="broadcast-panel" id="broadcastPanel">
  <h3>Рассылка объявления</h3>
  <div class="sub" id="broadcastSub">Уйдёт всем заявкам с подключённым Telegram.</div>
  <div class="broadcast-row">
    <div>
      <textarea id="bcText" placeholder="Текст объявления — например, о новом апдейте или акции для трафика"></textarea>
      <input type="file" id="bcPhoto" accept="image/*">
    </div>
    <div>
      <button class="btn-topbar" id="bcSend">Отправить всем</button>
      <div class="broadcast-result" id="bcResult"></div>
    </div>
  </div>
</div>

<div class="layout">
  <div class="list-pane">
    <table>
      <thead>
        <tr><th>#</th><th>Дата</th><th>Тип</th><th>GEO</th><th>Telegram</th><th>Статус</th></tr>
      </thead>
      <tbody id="appRows"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none">Заявок пока нет — как только кто-то заполнит анкету на сайте, она появится здесь.</div>
  </div>

  <div class="detail-pane" id="detailPane">
    <div class="placeholder">Выберите заявку слева, чтобы посмотреть детали и отправить оффер.</div>
  </div>
</div>

<script>
(function(){
  var appRows = document.getElementById('appRows');
  var emptyState = document.getElementById('emptyState');
  var detailPane = document.getElementById('detailPane');
  var applications = [];
  var activeId = null;

  var STATUS_LABEL = {
    new: 'Новая', connected: 'Telegram подключён', offer_sent: 'Оффер отправлен', interested: 'Заинтересован'
  };

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); }
    catch(e){ return iso; }
  }

  function loadApplications() {
    fetch('/admin/api/applications').then(function(r){ return r.json(); }).then(function(data){
      applications = data;
      renderRows();
      var connected = data.filter(function(a){ return a.telegram_chat_id; }).length;
      document.getElementById('connectedCount').textContent = connected + ' подключено в Telegram';
      document.getElementById('broadcastSub').textContent =
        'Уйдёт всем заявкам с подключённым Telegram (сейчас ' + connected + ').';
    });
  }

  function renderRows() {
    appRows.innerHTML = '';
    emptyState.style.display = applications.length ? 'none' : 'block';
    applications.forEach(function(app){
      var tr = document.createElement('tr');
      tr.className = 'app-row' + (String(app.id) === String(activeId) ? ' active' : '');
      tr.innerHTML =
        '<td>#' + app.id + '</td>' +
        '<td>' + fmtDate(app.created_at) + '</td>' +
        '<td>' + escapeHtml(app.traffic_type || '—') + '</td>' +
        '<td>' + escapeHtml(app.geo || '—') + '</td>' +
        '<td>' + (app.telegram_username ? '@' + escapeHtml(app.telegram_username) : (app.telegram_chat_id ? 'id ' + app.telegram_chat_id : '—')) + '</td>' +
        '<td><span class="pill ' + app.status + '">' + (STATUS_LABEL[app.status] || app.status) + '</span></td>';
      tr.addEventListener('click', function(){ selectApplication(app.id); });
      appRows.appendChild(tr);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function tagsLine(arr) {
    if (!arr || !arr.length) return '<span class="placeholder">—</span>';
    return '<div class="tagsline">' + arr.map(function(a){ return '<span>' + escapeHtml(a) + '</span>'; }).join('') + '</div>';
  }

  function selectApplication(id) {
    activeId = id;
    renderRows();
    fetch('/admin/api/applications/' + id).then(function(r){ return r.json(); }).then(function(data){
      renderDetail(data.application, data.offers, data.attachments || []);
    });
  }

  function formatBytes(n) {
    if (!n && n !== 0) return '';
    if (n < 1024) return n + ' Б';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' КБ';
    return (n / (1024 * 1024)).toFixed(1) + ' МБ';
  }

  function attachmentsBlock(attachments) {
    if (!attachments.length) return '<span class="placeholder">Файлы не прикреплены.</span>';
    return '<div class="attachments">' + attachments.map(function(a){
      var url = '/admin/api/attachments/' + a.id + '/file';
      if ((a.mime_type || '').indexOf('image/') === 0) {
        return '<a href="' + url + '" target="_blank" title="' + escapeHtml(a.filename || '') + '">' +
               '<img class="attach-thumb" src="' + url + '" alt="' + escapeHtml(a.filename || 'screenshot') + '"></a>';
      }
      return '<a class="attach-file" href="' + url + '" target="_blank">' + escapeHtml(a.filename || 'файл') + '<br>' + formatBytes(a.size_bytes) + '</a>';
    }).join('') + '</div>';
  }

  function renderDetail(app, offers, attachments) {
    var connected = !!app.telegram_chat_id;
    detailPane.innerHTML =
      '<h2>Заявка #' + app.id + '</h2>' +
      '<dl class="kv">' +
        '<dt>Тип трафика</dt><dd>' + escapeHtml(app.traffic_type || '—') + '</dd>' +
        '<dt>GEO</dt><dd>' + escapeHtml(app.geo || '—') + '</dd>' +
        '<dt>Вертикаль</dt><dd>' + escapeHtml(app.vertical || '—') + '</dd>' +
        '<dt>Площадки</dt><dd style="white-space:pre-line">' + escapeHtml(app.platforms || '—') + '</dd>' +
        '<dt>Подписчики</dt><dd>' + escapeHtml(app.followers || '—') + '</dd>' +
        '<dt>Просмотры</dt><dd>' + escapeHtml(app.views || '—') + '</dd>' +
        '<dt>FTD/мес</dt><dd>' + escapeHtml(app.ftd || '—') + '</dd>' +
        '<dt>Работает с</dt><dd>' + tagsLine(app.partners_current) + '</dd>' +
        '<dt>Работал(а) с</dt><dd>' + tagsLine(app.partners_past) + '</dd>' +
        '<dt>Желаемые условия</dt><dd>' + tagsLine(app.desired_models) + '</dd>' +
        '<dt>Желаемый rate</dt><dd>' + escapeHtml(app.desired_rate || '—') + '</dd>' +
        '<dt>Комментарий</dt><dd style="white-space:pre-line">' + escapeHtml(app.comment || '—') + '</dd>' +
        '<dt>Язык анкеты</dt><dd>' + escapeHtml((app.lang || 'ru').toUpperCase()) + '</dd>' +
        '<dt>Telegram</dt><dd>' + (connected ? ('@' + escapeHtml(app.telegram_username || '') + ' (chat ' + app.telegram_chat_id + ')') : 'не подключён') + '</dd>' +
        '<dt>Скрины</dt><dd>' + attachmentsBlock(attachments) + '</dd>' +
      '</dl>' +

      '<div class="offer-form">' +
        '<h3 style="font-size:15px">Отправить оффер</h3>' +
        (connected ? '' : '<p style="color:var(--bad);font-size:13px;margin-top:8px">У заявки ещё не подключён Telegram — оффер отправить нельзя.</p>') +
        '<label>Название партнёрки</label><input id="ofPartner" placeholder="Например: Mostbet Partners">' +
        '<label>GEO</label><input id="ofGeo" placeholder="Например: 🇺🇿 Узбекистан" value="' + escapeHtml(app.geo || '') + '">' +
        '<label>Ставка / условия</label><input id="ofRate" placeholder="Например: до 50% RS / CPA / Fix">' +
        '<label>Теги через запятую</label><input id="ofTags" placeholder="APK, промокод, дизайнер, персональный менеджер">' +
        '<button id="ofSend"' + (connected ? '' : ' disabled') + '>Отправить в Telegram</button>' +
        '<div class="msg" id="ofMsg"></div>' +
      '</div>' +

      '<div class="offers-history">' +
        '<h3 style="font-size:15px">История офферов</h3>' +
        (offers.length ? offers.map(function(o){
          return '<div class="offer-item"><b>' + escapeHtml(o.partner_name) + '</b> — ' + escapeHtml(o.geo || '—') + ', ' + escapeHtml(o.rate || '—') +
                 ' <span class="pill ' + (o.status === 'interested' ? 'interested' : 'offer_sent') + '">' + (o.status === 'interested' ? 'заинтересован' : 'отправлен') + '</span></div>';
        }).join('') : '<p class="placeholder">Офферов ещё не было.</p>') +
      '</div>';

    var sendBtn = document.getElementById('ofSend');
    if (sendBtn) {
      sendBtn.addEventListener('click', function(){
        var msg = document.getElementById('ofMsg');
        var partnerName = document.getElementById('ofPartner').value.trim();
        if (!partnerName) {
          msg.className = 'msg show err'; msg.textContent = 'Укажите название партнёрки.'; return;
        }
        sendBtn.disabled = true; sendBtn.textContent = 'Отправляем…';
        fetch('/admin/api/applications/' + app.id + '/offers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            partnerName: partnerName,
            geo: document.getElementById('ofGeo').value.trim(),
            rate: document.getElementById('ofRate').value.trim(),
            tags: document.getElementById('ofTags').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean)
          })
        }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
          .then(function(res){
            sendBtn.disabled = false; sendBtn.textContent = 'Отправить в Telegram';
            if (!res.ok) {
              msg.className = 'msg show err'; msg.textContent = res.data.error || 'Не удалось отправить оффер.';
              return;
            }
            msg.className = 'msg show ok'; msg.textContent = 'Оффер отправлен в Telegram!';
            loadApplications();
            selectApplication(app.id);
          }).catch(function(){
            sendBtn.disabled = false; sendBtn.textContent = 'Отправить в Telegram';
            msg.className = 'msg show err'; msg.textContent = 'Сетевая ошибка, попробуйте ещё раз.';
          });
      });
    }
  }

  var broadcastToggle = document.getElementById('broadcastToggle');
  var broadcastPanel = document.getElementById('broadcastPanel');
  broadcastToggle.addEventListener('click', function(){
    broadcastPanel.classList.toggle('open');
  });

  document.getElementById('bcSend').addEventListener('click', function(){
    var btn = this;
    var text = document.getElementById('bcText').value.trim();
    var fileInput = document.getElementById('bcPhoto');
    var result = document.getElementById('bcResult');
    result.textContent = '';

    if (!text) {
      result.style.color = 'var(--bad)';
      result.textContent = 'Введите текст объявления.';
      return;
    }

    var fd = new FormData();
    fd.append('text', text);
    if (fileInput.files && fileInput.files[0]) fd.append('photo', fileInput.files[0]);

    btn.disabled = true;
    btn.textContent = 'Отправляем…';

    fetch('/admin/api/broadcast', { method: 'POST', body: fd })
      .then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        btn.disabled = false; btn.textContent = 'Отправить всем';
        if (!res.ok) {
          result.style.color = 'var(--bad)';
          result.textContent = res.data.error || 'Не удалось выполнить рассылку.';
          return;
        }
        result.style.color = 'var(--good)';
        result.textContent = 'Отправлено: ' + res.data.sent + ' из ' + res.data.total + (res.data.failed ? (', ошибок: ' + res.data.failed) : '') + '.';
        document.getElementById('bcText').value = '';
        fileInput.value = '';
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = 'Отправить всем';
        result.style.color = 'var(--bad)';
        result.textContent = 'Сетевая ошибка, попробуйте ещё раз.';
      });
  });

  loadApplications();
  setInterval(loadApplications, 20000);
})();
</script>
</body>
</html>
